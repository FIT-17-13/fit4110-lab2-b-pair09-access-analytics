openapi: 3.1.0
info:
  title: Smart Campus — Analytics Service API (Nhóm 5)
  version: 1.0.0
  description: |
    Hợp đồng API giữa Analytics Service (Consumer) và Access Gate (Provider).
    Sử dụng để nhận luồng event và lấy báo cáo thống kê.
  contact:
    name: Kiều Quang Trường - Nhóm 5
    email: kieuquangtruong2005tn@gmail.com
servers:
  - url: http://localhost:4010
    description: FastAPI / Prism mock server
  - url: https://api.campus.local
    description: Class network placeholder
tags:
  - name: health
    description: Kiểm tra trạng thái service
  - name: alerts
    description: Thống kê số lượng cảnh báo an ninh
  - name: events
    description: Xử lý đồng bộ log sự kiện từ Access Gate
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra trạng thái service
      description: Endpoint kiểm tra service Analytics còn hoạt động tốt hay không.
      tags: [health]
      security: []
      responses:
        '200':
          description: Service đang hoạt động
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              examples:
                ok:
                  value:
                    status: ok
                    service: analytics-service
                    time: '2026-05-19T10:00:00Z'

  /alerts/recent:
    get:
      operationId: getRecentAlerts
      summary: Lấy thống kê số lượng cảnh báo gần đây
      description: Lấy danh sách các bản ghi tổng hợp cảnh báo phục vụ Dashboard.
      tags: [alerts]
      parameters:
        - name: limit
          in: query
          required: false
          description: Số cảnh báo tối đa cần lấy.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Danh sách cảnh báo gần đây
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    minItems: 0
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Alert'
              examples:
                recentAlerts:
                  value:
                    items:
                      - id: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                        sourceService: access-gate
                        alertType: UNAUTHORIZED_ACCESS
                        severity: HIGH
                        message: Phát hiện thẻ không hợp lệ quẹt liên tục tại GATE-01
                        relatedEventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babc
                        status: OPEN
                        createdAt: '2026-05-19T10:00:00Z'
                        resolvedAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /events:
    post:
      operationId: createCampusEvent
      summary: Đồng bộ log sự kiện từ Access Gate vào hệ thống Analytics
      description: |
        Endpoint minh họa polymorphism xử lý nhận sự kiện. 
        Mặc dù dùng Queue nhưng endpoint REST này hỗ trợ đồng bộ dữ liệu bù khi gặp sự cố (Idempotency).
      tags: [events]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampusEvent'
            examples:
              accessLogCreated:
                value:
                  eventType: ACCESS_CHECK
                  eventId: 0196fb3d-4ad7-7d1e-9f49-5d5148d2babd
                  gateId: GATE-01
                  cardId: RFID-2026-001
                  decision: ALLOW
                  timestamp: '2026-05-19T10:01:00Z'
      responses:
        '201':
          description: Sự kiện đã được Analytics ghi nhận thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Dữ liệu sai định dạng JSON Schema
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Thiếu hoặc sai thông tin Bearer Token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Không có quyền truy cập endpoint Analytics
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Bản ghi hoặc tài nguyên thống kê không tồn tại
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Trùng lặp mã event_id (Idempotency Key)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Vi phạm quy tắc nghiệp vụ dữ liệu campus
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Lỗi hệ thống Analytics bên trong
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
        time:
          type: string
          format: date-time

    Alert:
      type: object
      additionalProperties: false
      required: [id, sourceService, alertType, severity, message, relatedEventId, status, createdAt, resolvedAt]
      properties:
        id:
          type: string
          format: uuid
        sourceService:
          type: string
        alertType:
          type: string
          enum: [UNAUTHORIZED_ACCESS, SENSOR_THRESHOLD_EXCEEDED, SYSTEM_ERROR]
        severity:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        message:
          type: string
        relatedEventId:
          type: [string, 'null']
          format: uuid
        status:
          type: string
          enum: [OPEN, ACKNOWLEDGED, RESOLVED]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: [string, 'null']
          format: date-time

    CampusEvent:
      oneOf:
        - $ref: '#/components/schemas/SensorEvent'
        - $ref: '#/components/schemas/AccessEvent'
      discriminator:
        propertyName: eventType
        mapping:
          SENSOR_READING: '#/components/schemas/SensorEvent'
          ACCESS_CHECK: '#/components/schemas/AccessEvent'

    SensorEvent:
      type: object
      additionalProperties: false
      required: [eventType, eventId, deviceId, metric, value, unit, timestamp]
      properties:
        eventType:
          type: string
          const: SENSOR_READING
        eventId:
          type: string
          format: uuid
        deviceId:
          type: string
        metric:
          type: string
          enum: [temperature, humidity]
        value:
          type: number
        unit:
          type: string
        timestamp:
          type: string
          format: date-time

    AccessEvent:
      type: object
      additionalProperties: false
      required: [eventType, eventId, gateId, cardId, decision, timestamp]
      properties:
        eventType:
          type: string
          const: ACCESS_CHECK
        eventId:
          type: string
          format: uuid
        gateId:
          type: string
        cardId:
          type: string
        decision:
          type: string
          enum: [ALLOW, DENY]
        timestamp:
          type: string
          format: date-time

    EventAccepted:
      type: object
      additionalProperties: false
      required: [eventId, acceptedAt]
      properties:
        eventId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
        errors:
          type: array
          items:
            type: object